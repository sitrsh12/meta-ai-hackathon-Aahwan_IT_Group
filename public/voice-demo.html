<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZapperTrip Resort - AI Voice Demo</title>
<script src="phone-input.js"></script>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #0f766e 0%, #064e3b 100%); color: white; text-align: center; padding: 20px; min-height: 100vh; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    h1 { margin-bottom: 8px; font-weight: 800; font-size: 26px; letter-spacing: -0.5px;}
    p.subtitle { color: #99f6e4; margin-top: 0; margin-bottom: 30px; font-size: 16px;}
    .box { background: white; color: #1e293b; padding: 35px 25px; border-radius: 24px; max-width: 380px; width: 100%; box-shadow: 0 20px 40px rgba(0,0,0,0.3); box-sizing: border-box; }
    .mic-container { width: 90px; height: 90px; background: #f1f5f9; border-radius: 50%; margin: 0 auto 24px; display: flex; align-items: center; justify-content: center; font-size: 36px; transition: all 0.3s ease; }
    .mic-container.listening { background: #fef2f2; box-shadow: 0 0 0 15px rgba(239, 68, 68, 0.2); animation: pulse 1.5s infinite; }
    .mic-container.speaking { background: #f0fdfa; box-shadow: 0 0 0 15px rgba(15, 118, 110, 0.2); }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    #status { font-weight: 600; font-size: 16px; margin-bottom: 12px; min-height: 20px; color: #0f766e; }
    #aiReply { color: #64748b; font-style: italic; min-height: 40px; line-height: 1.5; margin-bottom: 20px; font-size: 15px;}
    button { background: #0f766e; color: white; padding: 16px 32px; border: none; border-radius: 50px; font-size: 17px; font-weight: 700; cursor: pointer; width: 100%; transition: background 0.2s; margin-top: 20px; }
    button:hover { background: #115e59; }
    button:disabled { background: #94a3b8; cursor: not-allowed; }
    .reset-btn { background: #2563eb; margin-top: 15px; display: none; }
    .reset-btn:hover { background: #1d4ed8; }
</style>
</head>
<body>

    <h1>ZapperTrip Resort - Budhabare</h1>
    <p class="subtitle">Llama 3 Voice AI Booking Assistant</p>

    <div class="box" id="phoneScreen">
        <h2 style="margin-top:0; font-size: 20px;">Welcome to the Demo</h2>
        <p style="color:#64748b; font-size:14px; margin-bottom: 25px; line-height: 1.4;">Enter your WhatsApp number to receive your live booking confirmation.</p>
        <div style="text-align: left;">
            <label style="font-size: 12px; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; display: block;">WhatsApp Number</label>
            <div id="phoneInputHost"></div>
        </div>
        <button onclick="startDemo()">Start Voice Call</button>
    </div>

    <div class="box" id="callScreen" style="display: none;">
        <div class="mic-container" id="micVisual">🎙️</div>
        <h2 id="status">Tap to speak</h2>
        <p id="aiReply">I am ready to help you book a room.</p>
        
        <button onclick="startCall()" id="callBtn">🎙️ Start Speaking</button>
        <button onclick="resetBooking()" id="resetBtn" class="reset-btn">🔄 Start a New Booking</button>
    </div>

<script>
    let judgePhone = '';
    let activeBooking = null;
    let chatHistory = [];
    
    const statusEl = document.getElementById('status');
    const aiReplyEl = document.getElementById('aiReply');
    const micVisual = document.getElementById('micVisual');
    const callBtn = document.getElementById('callBtn');
    const resetBtn = document.getElementById('resetBtn');

    document.addEventListener('DOMContentLoaded', () => {
        if (window.PhoneInput) {
            PhoneInput.mount('phoneInputHost', { id: 'judgePhone', placeholder: '202 555 0123', defaultCountry: 'US' });
        }
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    function startDemo() {
        const phone = window.PhoneInput ? PhoneInput.getDigits('judgePhone') : '';
        if (!phone || phone.length < 10) return alert('Please enter a valid WhatsApp number.');
        judgePhone = phone;
        document.getElementById('phoneScreen').style.display = 'none';
        document.getElementById('callScreen').style.display = 'block';
    }

    function resetBooking() {
        activeBooking = null;
        chatHistory = [];
        resetBtn.style.display = 'none';
        callBtn.style.display = 'block';
        micVisual.style.display = 'flex';
        aiReplyEl.innerText = "I am ready to help you book a room.";
        statusEl.innerText = "Tap to speak";
    }

    function cleanText(text) { return text.replace(/[*\/\\_#`~]/g, '').replace(/\n/g, ' ').trim(); }

    function speak(text) {
        window.speechSynthesis.cancel(); 
        const clean = cleanText(text);
        aiReplyEl.innerText = '"' + clean + '"';
        micVisual.className = 'mic-container speaking';
        micVisual.innerText = '🔊';
        statusEl.innerText = 'AI is speaking...';

        let utt = new SpeechSynthesisUtterance(clean);
        utt.lang = 'en-US';
        utt.rate = 0.95;
        
        let fallbackTimer = setTimeout(() => {
            micVisual.className = 'mic-container';
            micVisual.innerText = '🎙️';
            statusEl.innerText = 'Tap to speak again';
            callBtn.disabled = false;
            callBtn.innerText = '🎙️ Speak Again';
        }, text.length * 100 + 3000);

        utt.onend = () => {
            clearTimeout(fallbackTimer);
            micVisual.className = 'mic-container';
            micVisual.innerText = '🎙️';
            statusEl.innerText = 'Tap to speak again';
            callBtn.disabled = false;
            callBtn.innerText = '🎙️ Speak Again';
        };
        window.speechSynthesis.speak(utt);
    }

    async function processBackend(userText) {
        if (activeBooking) {
            speak('Your booking for the ' + activeBooking + ' is already on hold. Please click the blue button to start a new booking.');
            return;
        }

        statusEl.innerText = 'You said: ' + userText;
        aiReplyEl.innerText = 'Thinking...';
        micVisual.className = 'mic-container';
        
        chatHistory.push({ role: 'user', content: userText });
        
        try {
            const res = await fetch('/hackathon/api/voice', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: userText, phone: judgePhone, history: chatHistory })
            });
            const data = await res.json();
            
            chatHistory.push({ role: 'assistant', content: data.reply });
            
            if (data.booking_confirmed && data.room_type) {
                activeBooking = data.room_type;
                callBtn.style.display = 'none';
                micVisual.style.display = 'none';
                resetBtn.style.display = 'block';
            }
            speak(data.reply);
        } catch (err) { speak('Sorry, I lost my connection to the server.'); }
    }

    function startCall() {
        if (!SpeechRecognition) return alert("Voice not supported. Please use Chrome.");
        window.speechSynthesis.cancel();
        callBtn.disabled = true;
        callBtn.innerText = 'Listening...';
        aiReplyEl.innerText = '';
        micVisual.className = 'mic-container listening';
        statusEl.innerText = 'Listening... Speak now';
        
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;

        recognition.onresult = (event) => {
            recognition.stop(); 
            processBackend(event.results[0][0].transcript);
        };
        recognition.onerror = (event) => {
            statusEl.innerText = 'Mic Error: ' + event.error;
            callBtn.disabled = false;
            callBtn.innerText = 'Try Again';
            micVisual.className = 'mic-container';
        };
        recognition.start();
    }
</script>
</body>
</html>
